<dialog
  #dialogEl
  class="ea-dialog"
  [id]="id()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="!ariaLabel() ? id() + '-header' : null"
  (click)="handleBackdropClick($event)"
  (cancel)="handleCancel($event)">
  <div
    class="ea-dialog__panel"
    [ngClass]="panelClasses()">
    @if (showClose()) {
      <button
        type="button"
        class="ea-dialog__close"
        aria-label="Close dialog"
        (click)="handleClose()">
        <ea-icon-x />
      </button>
    }

    <div
      class="ea-dialog__header"
      [id]="id() + '-header'">
      <ng-content select="[slot=header]" />
    </div>

    <div class="ea-dialog__body">
      <ng-content />
    </div>

    <div class="ea-dialog__footer">
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</dialog>
