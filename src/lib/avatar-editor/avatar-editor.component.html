<div
  class="ea-avatar-editor"
  [ngClass]="hostClasses()">
  <input
    #fileInputEl
    type="file"
    class="ea-avatar-editor__file-input"
    [attr.aria-label]="i18n.messages().avatarEditor.upload"
    [accept]="accept()"
    (change)="onFileSelected($event)" />

  @if (!hasImage() && !isLoading()) {
    <button
      type="button"
      class="ea-avatar-editor__dropzone"
      [style.width.px]="canvasSize()"
      [style.height.px]="canvasSize()"
      (click)="openFilePicker()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)">
      <ea-icon-upload class="ea-avatar-editor__upload-icon" />
      <span class="ea-avatar-editor__dropzone-text">
        {{ i18n.messages().avatarEditor.dropzone }}
      </span>
    </button>
  }

  @if (hasImage() || isLoading()) {
    <div
      class="ea-avatar-editor__canvas-wrapper"
      [style.width.px]="canvasSize()"
      [style.height.px]="canvasSize()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)">
      @if (isLoading()) {
        <ea-skeleton
          [variant]="shape() === 'circle' ? 'circle' : 'rect'"
          [width]="canvasSize() + 'px'"
          [height]="canvasSize() + 'px'" />
      }

      @if (hasImage()) {
        <canvas
          #canvasEl
          class="ea-avatar-editor__canvas"
          role="img"
          tabindex="0"
          [attr.aria-label]="i18n.messages().avatarEditor.canvas"
          [style.display]="isLoading() ? 'none' : 'block'"
          [width]="canvasSize()"
          [height]="canvasSize()"
          (mousedown)="onMouseDown($event)"
          (touchstart)="onTouchStart($event)"
          (keydown)="onCanvasKeydown($event)"></canvas>

        @if (!isLoading()) {
          <div
            class="ea-avatar-editor__canvas-overlay"
            [class.ea-avatar-editor__canvas-overlay--on-light]="!isImageDark()">
            <ea-icon-camera class="ea-avatar-editor__overlay-icon" />
            <span>{{ i18n.messages().avatarEditor.change }}</span>
          </div>
        }
      }
    </div>
  }

  <div class="ea-avatar-editor__controls">
    <button
      type="button"
      class="ea-avatar-editor__icon-btn"
      [eaTooltip]="i18n.messages().avatarEditor.revert"
      [attr.aria-label]="i18n.messages().avatarEditor.revert"
      [disabled]="!canRevert() || isLoading()"
      (click)="revertImage()">
      <ea-icon-rotate-ccw />
    </button>

    <button
      type="button"
      class="ea-avatar-editor__icon-btn"
      [eaTooltip]="i18n.messages().avatarEditor.zoomOut"
      [attr.aria-label]="i18n.messages().avatarEditor.zoomOut"
      [disabled]="!hasImage() || isLoading() || zoom() <= minZoom()"
      (click)="setZoom(zoom() - 0.1)">
      <ea-icon-minus />
    </button>

    <input
      type="range"
      class="ea-avatar-editor__zoom-slider"
      [min]="minZoom()"
      [max]="maxZoom()"
      step="0.01"
      [value]="zoom()"
      [disabled]="!hasImage() || isLoading()"
      [attr.aria-label]="i18n.messages().avatarEditor.zoom"
      (input)="onZoomInput($event)" />

    <button
      type="button"
      class="ea-avatar-editor__icon-btn"
      [eaTooltip]="i18n.messages().avatarEditor.zoomIn"
      [attr.aria-label]="i18n.messages().avatarEditor.zoomIn"
      [disabled]="!hasImage() || isLoading() || zoom() >= maxZoom()"
      (click)="setZoom(zoom() + 0.1)">
      <ea-icon-plus />
    </button>

    <button
      type="button"
      class="ea-avatar-editor__icon-btn ea-avatar-editor__icon-btn--danger"
      [eaTooltip]="i18n.messages().avatarEditor.remove"
      [attr.aria-label]="i18n.messages().avatarEditor.remove"
      [disabled]="!hasImage() || isLoading()"
      (click)="removeImage()">
      <ea-icon-trash />
    </button>
  </div>
</div>
