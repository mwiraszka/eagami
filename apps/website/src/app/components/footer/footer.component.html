<footer class="web-footer">
  <!-- div, not p: the divider renders a block element, which the HTML parser
       would eject from a p when hydrating the server-rendered markup -->
  <div class="web-footer__copyright">
    <span>{{ messages().common.footer.copyright(currentYear) }}</span>
    <ea-divider
      class="web-footer__divider"
      orientation="vertical" />
    <span>{{ messages().common.footer.allRightsReserved }}</span>
  </div>
  <nav
    class="web-footer__links"
    [attr.aria-label]="messages().common.footer.navLabel">
    <a
      class="web-footer__link"
      routerLink="/privacy">
      {{ messages().common.footer.privacyLink }}
    </a>
    <a
      class="web-footer__link"
      routerLink="/terms">
      {{ messages().common.footer.termsLink }}
    </a>
    <a
      class="web-footer__link"
      href="https://www.npmjs.com/package/@eagami/ui"
      target="_blank"
      rel="noopener noreferrer"
      [eaTooltip]="messages().common.footer.npmTooltip"
      tooltipPosition="top">
      {{ messages().common.footer.npmLink }}
    </a>
    <a
      class="web-footer__link web-footer__link--icon"
      href="https://github.com/mwiraszka/eagami"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="messages().common.footer.githubAriaLabel"
      [eaTooltip]="messages().common.footer.githubTooltip"
      tooltipPosition="top">
      <ea-icon-github />
    </a>
  </nav>
</footer>
