<!-- Both icons render every time; CSS in the .scss picks one to show based on
     the `data-theme` attribute on `<html>` (set by the inline bootstrap script
     in index.html before paint). No `@if (mode() === ...)` so the icon never
     flashes during hydration even before the ThemeService signal resolves. -->
<button
  type="button"
  class="web-theme-toggle"
  [eaTooltip]="messages().common.themeToggleTooltip"
  tooltipPosition="bottom"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="mode() === 'dark'"
  (click)="cycle()">
  <svg
    class="web-theme-toggle__icon web-theme-toggle__icon--moon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
  </svg>
  <svg
    class="web-theme-toggle__icon web-theme-toggle__icon--sun"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">
    <circle
      cx="12"
      cy="12"
      r="4" />
    <path d="M12 2v2" />
    <path d="M12 20v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="m17.66 17.66 1.41 1.41" />
    <path d="M2 12h2" />
    <path d="M20 12h2" />
    <path d="m6.34 17.66-1.41 1.41" />
    <path d="m19.07 4.93-1.41 1.41" />
  </svg>
</button>
