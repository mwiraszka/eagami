<header class="web-header">
  <a
    class="web-header__brand"
    [class.web-header__brand--hidden]="!brandVisible()"
    [attr.aria-hidden]="!brandVisible() ? 'true' : null"
    [attr.tabindex]="brandVisible() ? null : -1"
    routerLink="/"
    aria-label="eagami home">
    <ea-icon-eagami class="web-header__brand-icon" />
    <span class="web-header__brand-text">eagami</span>
  </a>
  <nav
    class="web-header__nav"
    aria-label="Primary">
    <a
      class="web-header__link"
      routerLink="/ui"
      routerLinkActive="web-header__link--active"
      data-tooltip="Component library docs">
      UI
    </a>
    <a
      class="web-header__link web-header__link--icon"
      href="https://github.com/mwiraszka/eagami-design-system"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="eagami-design-system on GitHub"
      data-tooltip="View source on GitHub">
      <ea-icon-github />
    </a>
    <web-theme-toggle />
  </nav>
</header>
