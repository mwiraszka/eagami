<header class="web-header">
  <div class="web-header__lockup">
    <a
      class="web-header__link"
      [class.web-header__link--muted]="inUiSection()"
      routerLink="/"
      [attr.aria-label]="messages().common.brandHome">
      <ea-eagami-wordmark
        [linked]="false"
        [size]="18" />
    </a>
    <span
      class="web-header__divider"
      aria-hidden="true">
    </span>
    <a
      class="web-header__link web-header__link--section"
      [class.web-header__link--muted]="!inUiSection()"
      routerLink="/ui">
      Eagami UI
    </a>
  </div>
  <nav
    class="web-header__nav"
    aria-label="Primary">
    <web-locale-switcher />
    <web-theme-toggle />
  </nav>
</header>
