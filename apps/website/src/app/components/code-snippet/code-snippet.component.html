<div class="code-snippet">
  <pre class="code-snippet__code"><code>{{ code() }}</code></pre>
  <button
    type="button"
    class="code-snippet__copy"
    [attr.aria-label]="messages().common.codeSnippet.copyLabel"
    [eaTooltip]="messages().common.codeSnippet.copyLabel"
    tooltipPosition="left"
    (click)="copy()">
    <ea-icon-copy />
  </button>
</div>
