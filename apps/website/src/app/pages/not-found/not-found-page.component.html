<section class="not-found">
  <ea-empty-state
    size="xl"
    [title]="messages().notFound.title"
    [description]="messages().notFound.lede">
    <span
      slot="media"
      class="not-found__eyebrow">
      {{ messages().notFound.eyebrow }}
    </span>
    <a
      slot="actions"
      class="not-found__cta"
      routerLink="/">
      {{ messages().notFound.cta }}
    </a>
  </ea-empty-state>
</section>
