<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [childMarkup]="childMarkup"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-radio-group
      class="demo-reserve-messages"
      [formControl]="control"
      value="apple"
      [label]="state().label"
      [labelIcon]="labelIconComponent()"
      [size]="state().size">
      <ea-radio
        value="apple"
        [label]="messages().ui.component.demos.radio.appleLabel" />
    </ea-radio-group>
  </web-component-playground>
</web-ui-component-demo-layout>
