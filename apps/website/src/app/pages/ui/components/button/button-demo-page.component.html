<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-button
      [icon]="iconComponent()"
      [variant]="state().variant"
      [size]="state().size"
      [type]="state().type"
      [disabled]="state().disabled"
      [loading]="state().loading"
      [fullWidth]="state().fullWidth"
      (clicked)="onButtonClick()">
      @if (state().label) {
        {{ state().label }}
      }
    </ea-button>
  </web-component-playground>
</web-ui-component-demo-layout>
