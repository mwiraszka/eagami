<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-tag
      [variant]="state().variant"
      [size]="state().size"
      [maxWidth]="state().maxWidth"
      [tooltip]="state().tooltip"
      [removable]="state().removable"
      [disabled]="state().disabled"
      [removeLabel]="state().removeLabel">
      {{ state().text }}
    </ea-tag>
  </web-component-playground>
</web-ui-component-demo-layout>
