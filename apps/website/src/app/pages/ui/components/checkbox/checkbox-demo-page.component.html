<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-checkbox
      [formControl]="control"
      [label]="state().label"
      [count]="state().count"
      [size]="state().size"
      [required]="state().required"
      [indeterminate]="state().indeterminate" />
  </web-component-playground>
</web-ui-component-demo-layout>
