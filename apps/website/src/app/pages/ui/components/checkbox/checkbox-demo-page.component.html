<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-checkbox
      class="demo-reserve-messages"
      [formControl]="control"
      [label]="state().label"
      [count]="state().count"
      [size]="state().size"
      [required]="state().required"
      [indeterminate]="state().indeterminate"
      [truncate]="state().truncate" />
  </web-component-playground>
</web-ui-component-demo-layout>
