<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-transfer-list
      [items]="items()"
      [(selectedIds)]="selectedIds"
      [size]="state().size"
      [disabled]="state().disabled"
      [sourceLabel]="state().sourceLabel || undefined"
      [targetLabel]="state().targetLabel || undefined" />
  </web-component-playground>
</web-ui-component-demo-layout>
