<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [childMarkup]="childMarkup()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-stepper
      [linear]="state().linear"
      [orientation]="state().orientation"
      [size]="state().size">
      @for (step of steps; track step.label) {
        <ea-step [label]="step.label">
          {{ step.content }}
        </ea-step>
      }
    </ea-stepper>
  </web-component-playground>
</web-ui-component-demo-layout>
