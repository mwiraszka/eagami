<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-textarea
      class="playground-field"
      [label]="state().label"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [resize]="state().resize"
      [rows]="state().rows"
      [maxlength]="state().maxlength"
      [maxHeight]="state().maxHeight"
      [disabled]="state().disabled"
      [readonly]="state().readonly"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
