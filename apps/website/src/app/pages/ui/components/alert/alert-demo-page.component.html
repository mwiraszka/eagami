<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-alert
      [variant]="state().variant"
      [size]="state().size"
      [dismissible]="state().dismissible"
      [icon]="iconComponent()">
      This is an alert message.
    </ea-alert>
  </web-component-playground>
</web-ui-component-demo-layout>
