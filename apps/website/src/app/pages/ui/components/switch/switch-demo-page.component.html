<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-switch
      class="demo-reserve-messages"
      [formControl]="control"
      [label]="state().label"
      [size]="state().size"
      [variant]="state().variant"
      [onIcon]="onIconComponent()"
      [offIcon]="offIconComponent()"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
