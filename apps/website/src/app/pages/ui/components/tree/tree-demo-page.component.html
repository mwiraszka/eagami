<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-tree
      [nodes]="nodes"
      [size]="state().size"
      [disabled]="state().disabled"
      [aria-label]="state().ariaLabel || 'File tree'"
      [expandedIds]="['src']" />
  </web-component-playground>
</web-ui-component-demo-layout>
