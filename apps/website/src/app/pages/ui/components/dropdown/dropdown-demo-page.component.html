<web-ui-component-demo-layout slug="dropdown">
  <h2>{{ messages().ui.component.sectionHeadings.basic }}</h2>
  <ea-dropdown
    [label]="messages().ui.component.demos.dropdown.fruitLabel"
    [placeholder]="messages().ui.component.demos.dropdown.fruitPlaceholder"
    [options]="dropdownOptions()"
    [(value)]="dropdownValue" />

  <h2>{{ messages().ui.component.sectionHeadings.withHint }}</h2>
  <ea-dropdown
    [label]="messages().ui.component.demos.dropdown.fruitLabel"
    [hint]="messages().ui.component.demos.dropdown.hintFavourite"
    [options]="dropdownOptions()"
    [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />

  <h2>{{ messages().ui.component.sectionHeadings.withError }}</h2>
  <ea-dropdown
    [label]="messages().ui.component.demos.dropdown.fruitLabel"
    [errorMsg]="messages().ui.component.demos.dropdown.errorRequired"
    [options]="dropdownOptions()"
    [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />

  <h2>{{ messages().ui.component.sectionHeadings.sizes }}</h2>
  <div class="demo-stack demo-stack--md">
    <ea-dropdown
      size="sm"
      [label]="messages().ui.component.common.small"
      [options]="dropdownOptions()"
      [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />
    <ea-dropdown
      size="md"
      [label]="messages().ui.component.common.medium"
      [options]="dropdownOptions()"
      [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />
    <ea-dropdown
      size="lg"
      [label]="messages().ui.component.common.large"
      [options]="dropdownOptions()"
      [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />
  </div>

  <h2>{{ messages().ui.component.sectionHeadings.disabled }}</h2>
  <ea-dropdown
    [label]="messages().ui.component.demos.dropdown.fruitLabel"
    [disabled]="true"
    [options]="dropdownOptions()"
    [placeholder]="messages().ui.component.demos.dropdown.selectPlaceholder" />
</web-ui-component-demo-layout>
