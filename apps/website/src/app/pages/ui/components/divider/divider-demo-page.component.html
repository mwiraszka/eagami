<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-divider
      class="playground-field"
      [label]="state().label"
      [orientation]="state().orientation"
      [thick]="state().thick" />
  </web-component-playground>
</web-ui-component-demo-layout>
