<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-divider
      class="divider-demo__field"
      [label]="state().label"
      [orientation]="state().orientation" />
  </web-component-playground>
</web-ui-component-demo-layout>
