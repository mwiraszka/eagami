<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [childMarkup]="childMarkup()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-accordion
      class="playground-accordion"
      [size]="state().size"
      [multi]="state().multi"
      [headingLevel]="state().headingLevel">
      @for (item of items(); track item.id) {
        <ea-accordion-item
          [value]="'item-' + item.id"
          [label]="item.heading"
          [disabled]="item.disabled">
          {{ item.content }}
        </ea-accordion-item>
      }
    </ea-accordion>

    <div
      customControls
      class="demo-items-editor">
      @for (item of items(); track item.id) {
        <div class="demo-item-row">
          <ea-input
            class="demo-item-row__grow"
            [placeholder]="messages().ui.component.common.heading"
            [value]="item.heading"
            (valueChange)="updateItem(item.id, { heading: $event })" />
          <ea-input
            class="demo-item-row__grow"
            [placeholder]="messages().ui.component.common.content"
            [value]="item.content"
            (valueChange)="updateItem(item.id, { content: $event })" />
          <ea-checkbox
            [label]="messages().ui.component.common.disabled"
            [checked]="item.disabled"
            (changed)="updateItem(item.id, { disabled: $event })" />
          <ea-button
            variant="ghost"
            size="sm"
            [eaTooltip]="messages().ui.component.common.deleteItem"
            [aria-label]="messages().ui.component.common.deleteItem"
            (clicked)="removeItem(item.id)">
            <ea-icon-trash class="demo-item-row__delete-icon" />
          </ea-button>
        </div>
      }
      <ea-button
        class="demo-items-editor__add"
        variant="secondary"
        size="sm"
        [eaTooltip]="messages().ui.component.common.addItem"
        [aria-label]="messages().ui.component.common.addItem"
        (clicked)="addItem()">
        <ea-icon-plus />
      </ea-button>
    </div>
  </web-component-playground>
</web-ui-component-demo-layout>
