<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [childMarkup]="childMarkup()"
    [extraAttributes]="extraAttributes()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-accordion
      class="playground-accordion"
      [size]="state().size"
      [multi]="state().multi"
      [headingLevel]="state().headingLevel"
      [highlightExpanded]="state().highlightExpanded"
      [(expandedValues)]="expanded">
      @for (item of items(); track item.id) {
        @if (item.badge) {
          <ea-accordion-item
            [value]="valueFor(item.id)"
            [icon]="iconFor(item.icon)"
            [disabled]="item.disabled">
            <span slot="label">
              {{ item.heading }}
              <ea-badge
                variant="info"
                size="sm">
                {{ item.badge }}
              </ea-badge>
            </span>
            {{ item.content }}
          </ea-accordion-item>
        } @else {
          <ea-accordion-item
            [value]="valueFor(item.id)"
            [label]="item.heading"
            [icon]="iconFor(item.icon)"
            [disabled]="item.disabled">
            {{ item.content }}
          </ea-accordion-item>
        }
      }
    </ea-accordion>

    <div
      customControls
      class="demo-items-editor">
      @for (item of items(); track item.id) {
        <div class="demo-item-row">
          <ea-input
            class="demo-item-row__grow"
            [placeholder]="messages().ui.component.common.heading"
            [value]="item.heading"
            (valueChange)="updateItem(item.id, { heading: $event })" />
          <ea-input
            class="demo-item-row__grow"
            [placeholder]="messages().ui.component.common.content"
            [value]="item.content"
            (valueChange)="updateItem(item.id, { content: $event })" />
          <ea-dropdown
            class="demo-item-row__icon-picker"
            [options]="iconOptions"
            [value]="item.icon"
            (changed)="updateItem(item.id, { icon: $event })" />
          <ea-checkbox
            [label]="messages().ui.component.common.disabled"
            [checked]="item.disabled"
            (changed)="updateItem(item.id, { disabled: $event })" />
          <ea-checkbox
            [label]="messages().ui.component.demos.accordion.expanded"
            [checked]="isExpanded(item.id)"
            (changed)="setExpanded(item.id, $event)" />
          <ea-button
            variant="ghost"
            size="sm"
            [eaTooltip]="messages().ui.component.common.deleteItem"
            [aria-label]="messages().ui.component.common.deleteItem"
            (clicked)="removeItem(item.id)">
            <ea-icon-trash class="demo-item-row__delete-icon" />
          </ea-button>
        </div>
      }
      <ea-button
        class="demo-items-editor__add"
        variant="secondary"
        size="sm"
        [eaTooltip]="messages().ui.component.common.addItem"
        [aria-label]="messages().ui.component.common.addItem"
        (clicked)="addItem()">
        <ea-icon-plus />
      </ea-button>
    </div>
  </web-component-playground>
</web-ui-component-demo-layout>
