<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <div class="demo-code-input">
      <ea-code-input
        class="demo-reserve-messages"
        [formControl]="control"
        [label]="state().label"
        [labelIcon]="labelIconComponent()"
        [placeholder]="state().placeholder"
        [length]="state().length"
        [size]="state().size"
        [allowAllChars]="state().allowAllChars"
        [readonly]="state().readonly"
        [required]="state().required" />
    </div>
  </web-component-playground>
</web-ui-component-demo-layout>
