<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-paginator
      class="paginator-demo__field"
      [totalItems]="state().totalItems"
      [align]="state().align"
      [showPageSizeSelector]="state().showPageSizeSelector"
      [showRangeLabel]="state().showRangeLabel"
      [disabled]="state().disabled" />
  </web-component-playground>
</web-ui-component-demo-layout>
