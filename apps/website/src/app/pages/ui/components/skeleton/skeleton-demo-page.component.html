<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-skeleton
      class="playground-field"
      [variant]="state().variant"
      [width]="state().width"
      [height]="state().height"
      [animated]="state().animated" />
  </web-component-playground>
</web-ui-component-demo-layout>
