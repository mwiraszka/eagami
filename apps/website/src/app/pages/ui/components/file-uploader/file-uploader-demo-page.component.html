<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-file-uploader
      [formControl]="control"
      class="playground-field demo-reserve-messages"
      [label]="state().label"
      [labelIcon]="labelIconComponent()"
      [size]="state().size"
      [variant]="state().variant"
      [buttonLabel]="state().buttonLabel || undefined"
      [buttonIcon]="buttonIconComponent()"
      [accept]="state().accept || undefined"
      [multiple]="state().multiple"
      [maxFiles]="state().maxFiles || undefined"
      [maxSize]="state().maxSize || undefined"
      [showFileList]="state().showFileList"
      [showConstraints]="state().showConstraints"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
