<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-number-input
      class="demo-number-input demo-reserve-messages"
      [style.font-size]="tierFontSize()"
      [formControl]="control"
      [label]="state().label"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [min]="asBound(state().min)"
      [max]="asBound(state().max)"
      [step]="state().step"
      [maxDigits]="asBound(state().maxDigits)"
      [allowNegative]="state().allowNegative"
      [readonly]="state().readonly"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
