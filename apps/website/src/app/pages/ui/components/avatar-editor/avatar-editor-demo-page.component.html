<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-avatar-editor
      [shape]="state().shape"
      [canvasSize]="state().canvasSize"
      [minZoom]="state().minZoom"
      [maxZoom]="state().maxZoom"
      [loading]="state().loading"
      (cropped)="onAvatarCropped($event)" />
    @if (croppedAvatarUrl()) {
      <div class="demo-avatar-result">
        <span class="demo-preview">
          {{ messages().ui.component.demos.avatarEditor.result }}
        </span>
        <ea-avatar
          [src]="croppedAvatarUrl()"
          size="xl" />
      </div>
    }
  </web-component-playground>
</web-ui-component-demo-layout>
