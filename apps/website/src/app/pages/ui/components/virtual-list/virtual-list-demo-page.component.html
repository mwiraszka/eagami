<web-ui-component-demo-layout slug="virtual-list">
  <h2>{{ messages().ui.component.sectionHeadings.basic }}</h2>
  <p class="demo-preview">
    {{
      messages().ui.component.demos.virtualList.scrollPosition(
        visibleIndex() + 1,
        rows.length
      )
    }}
  </p>
  <ea-virtual-list
    [items]="rows"
    [itemHeight]="44"
    [viewportHeight]="360"
    (scrollIndexChange)="onScrollIndex($event)">
    <ng-template
      #item
      let-row>
      <div class="virtual-list-demo__row">
        <strong>{{ row.label }}</strong>
        <span>{{ row.detail }}</span>
      </div>
    </ng-template>
  </ea-virtual-list>

  <h2>{{ messages().ui.component.sectionHeadings.compactDensity }}</h2>
  <ea-virtual-list
    [items]="rows"
    [itemHeight]="28"
    [viewportHeight]="240">
    <ng-template
      #item
      let-row>
      <div class="virtual-list-demo__row virtual-list-demo__row--compact">
        {{ row.label }}
      </div>
    </ng-template>
  </ea-virtual-list>
</web-ui-component-demo-layout>
