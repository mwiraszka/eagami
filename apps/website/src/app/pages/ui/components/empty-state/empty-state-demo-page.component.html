<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-empty-state
      [icon]="iconComponent()"
      [title]="state().title"
      [description]="state().description"
      [size]="state().size"
      [headingLevel]="state().headingLevel"
      [bordered]="state().bordered" />
  </web-component-playground>
</web-ui-component-demo-layout>
