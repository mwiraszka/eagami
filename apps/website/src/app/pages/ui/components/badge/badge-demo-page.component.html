<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-badge
      [variant]="state().variant"
      [size]="state().size"
      [shape]="state().shape"
      [uppercase]="state().uppercase">
      {{ state().text }}
    </ea-badge>
  </web-component-playground>
</web-ui-component-demo-layout>
