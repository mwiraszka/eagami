<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-date-picker
      [formControl]="control"
      class="playground-field demo-reserve-messages"
      [label]="state().label"
      [labelIcon]="labelIconComponent()"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [format]="state().format"
      [readonly]="state().readonly"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
