<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-multi-select
      class="playground-field"
      [options]="options()"
      [label]="state().label"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [searchable]="state().searchable"
      [disabled]="state().disabled"
      [readonly]="state().readonly"
      [required]="state().required"
      [maxVisibleChips]="state().maxVisibleChips" />
  </web-component-playground>
</web-ui-component-demo-layout>
