<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-avatar
      [src]="state().src"
      [initials]="state().initials"
      [alt]="state().alt"
      [size]="state().size"
      [shape]="state().shape" />
  </web-component-playground>
</web-ui-component-demo-layout>
