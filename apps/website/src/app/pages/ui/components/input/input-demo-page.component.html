<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-input
      class="input-demo__field"
      [label]="state().label"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [type]="state().type"
      [disabled]="state().disabled"
      [readonly]="state().readonly"
      [required]="state().required"
      [autofocus]="state().autofocus"
      [showPasswordToggle]="state().showPasswordToggle"
      [clearable]="state().clearable"
      [autocomplete]="state().autocomplete" />
  </web-component-playground>
</web-ui-component-demo-layout>
