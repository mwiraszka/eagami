<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-range-slider
      [formControl]="control"
      class="playground-field"
      [label]="state().label"
      [hint]="state().hint"
      [errorMsg]="state().errorMsg"
      [min]="state().min"
      [max]="state().max"
      [step]="state().step"
      [size]="state().size"
      [showValue]="state().showValue"
      [showMinMaxLabels]="state().showMinMaxLabels"
      [groupThousands]="state().groupThousands"
      [required]="state().required" />
  </web-component-playground>
</web-ui-component-demo-layout>
