<web-ui-component-demo-layout slug="spinner">

  <div class="demo-stack">
    <div>
      <span class="demo-label">{{ messages().ui.component.common.small }}</span>
      <ea-spinner size="sm" />
    </div>
    <div>
      <span class="demo-label">{{ messages().ui.component.common.medium }}</span>
      <ea-spinner size="md" />
    </div>
    <div>
      <span class="demo-label">{{ messages().ui.component.common.large }}</span>
      <ea-spinner size="lg" />
    </div>
  </div>

  <h2>{{ messages().ui.component.sectionHeadings.customLabel }}</h2>
  <ea-spinner label="Saving changes…" />
