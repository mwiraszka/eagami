<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-card
      [variant]="state().variant"
      [padding]="state().padding"
      [headerAlign]="state().headerAlign"
      [fullWidth]="state().fullWidth"
      [headerDivider]="state().headerDivider">
      <span slot="header">
        {{ messages().ui.component.demos.card.cardTitleHeader }}
      </span>
      {{ messages().ui.component.demos.card.bodyText }}
      <span slot="footer">{{ messages().ui.component.demos.card.footer }}</span>
    </ea-card>
  </web-component-playground>
</web-ui-component-demo-layout>
