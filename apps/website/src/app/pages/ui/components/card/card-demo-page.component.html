<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-card
      [variant]="state().variant"
      [padding]="state().padding"
      [headerAlign]="state().headerAlign"
      [fullWidth]="state().fullWidth"
      [headerDivider]="state().headerDivider">
      <span slot="header">Card Title</span>
      This is the card body content. It can contain any text or elements.
      <span slot="footer">Footer</span>
    </ea-card>
  </web-component-playground>
</web-ui-component-demo-layout>
