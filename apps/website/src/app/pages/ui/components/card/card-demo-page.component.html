<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [childMarkup]="childMarkup()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-card
      [variant]="state().variant"
      [padding]="state().padding"
      [headerAlign]="state().headerAlign"
      [fullWidth]="state().fullWidth"
      [headerDivider]="state().headerDivider">
      @if (state().headerText) {
        <span slot="header">{{ state().headerText }}</span>
      }
      {{ state().bodyText }}
      @if (state().footerText) {
        <span slot="footer">{{ state().footerText }}</span>
      }
    </ea-card>
  </web-component-playground>
</web-ui-component-demo-layout>
