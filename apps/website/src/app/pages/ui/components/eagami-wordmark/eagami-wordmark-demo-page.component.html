<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [directionToggle]="false"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-eagami-wordmark
      [variant]="state().variant"
      [layout]="state().layout"
      [size]="state().size"
      [linked]="state().linked" />
  </web-component-playground>
</web-ui-component-demo-layout>
