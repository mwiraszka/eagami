<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-autocomplete
      class="playground-field"
      [options]="options()"
      [label]="state().label"
      [placeholder]="state().placeholder"
      [size]="state().size"
      [minLength]="state().minLength"
      [maxResults]="state().maxResults"
      [disabled]="state().disabled"
      [readonly]="state().readonly"
      [required]="state().required" />

    <div
      customControls
      class="demo-items-editor">
      @for (item of optionItems(); track item.id) {
        <div class="demo-item-row">
          <ea-input
            class="demo-item-row__grow"
            placeholder="Option label"
            [value]="item.label"
            (valueChange)="updateOption(item.id, $event)" />
          <ea-button
            variant="ghost"
            size="sm"
            eaTooltip="Delete option"
            aria-label="Delete option"
            (clicked)="removeOption(item.id)">
            <ea-icon-trash class="demo-item-row__delete-icon" />
          </ea-button>
        </div>
      }
      <ea-button
        class="demo-items-editor__add"
        variant="secondary"
        size="sm"
        eaTooltip="Add option"
        aria-label="Add option"
        (clicked)="addOption()">
        <ea-icon-plus />
      </ea-button>
    </div>
  </web-component-playground>
</web-ui-component-demo-layout>
