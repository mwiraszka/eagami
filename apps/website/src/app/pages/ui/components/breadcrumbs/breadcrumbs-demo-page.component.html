<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-breadcrumbs
      [style.max-width.px]="state().width || null"
      [items]="items()"
      [separator]="state().separator"
      [size]="state().size"
      [maxItems]="state().maxItems || undefined"
      [overflow]="state().overflow"
      [aria-label]="state().ariaLabel || undefined"
      (clicked)="onBreadcrumbClick($event)" />
  </web-component-playground>
</web-ui-component-demo-layout>
