<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-progress-bar
      class="playground-field"
      [label]="state().label"
      [value]="state().value"
      [max]="state().max"
      [variant]="state().variant"
      [size]="state().size"
      [showValue]="state().showValue"
      [indeterminate]="state().indeterminate" />
  </web-component-playground>
</web-ui-component-demo-layout>
