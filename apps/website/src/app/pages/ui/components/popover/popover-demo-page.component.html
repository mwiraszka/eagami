<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    [extraAttributes]="extraAttributes()"
    [childMarkup]="childMarkup"
    [extraSnippet]="extraSnippet()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    @if (onRightClick()) {
      <div
        #trigger
        class="demo-context-area"
        tabindex="0"
        [eaContextMenuTrigger]="popoverRef">
        {{ messages().ui.component.common.rightClickHere }}
      </div>
    } @else {
      <button
        #trigger
        type="button"
        class="demo-popover-trigger"
        (click)="toggle()">
        {{ messages().ui.component.demos.popover.openLabel }}
      </button>
    }
    <ea-popover
      #popoverRef
      [anchor]="trigger()"
      [open]="open()"
      [anchorPoint]="point()"
      [contextMenu]="onRightClick()"
      [placement]="state().placement"
      [role]="state().role"
      [offset]="state().offset"
      [flip]="state().flip"
      [clamp]="state().clamp"
      [matchAnchorWidth]="state().matchAnchorWidth"
      [closeOnEscape]="state().closeOnEscape"
      [closeOnOutsideClick]="state().closeOnOutsideClick"
      [scrollBehavior]="state().scrollBehavior"
      (openRequested)="openAt($event)"
      (closeRequested)="close()">
      <div class="demo-popover-content">
        {{ messages().ui.component.demos.popover.basicContent }}
      </div>
    </ea-popover>
  </web-component-playground>
</web-ui-component-demo-layout>
