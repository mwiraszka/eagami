<web-ui-component-demo-layout
  [slug]="slug"
  [bare]="true">
  <web-component-playground
    playgroundHost
    [slug]="slug"
    [knobs]="knobs"
    [state]="state()"
    (knobChange)="onKnob($event)"
    (resetClicked)="reset()">
    <ea-rating
      [label]="state().label"
      [size]="state().size"
      [min]="state().min"
      [max]="state().max"
      [allowHalf]="state().allowHalf"
      [readonly]="state().readonly"
      [disabled]="state().disabled"
      [required]="state().required"
      [clearable]="state().clearable"
      [iconClass]="iconComponent()" />
  </web-component-playground>
</web-ui-component-demo-layout>
