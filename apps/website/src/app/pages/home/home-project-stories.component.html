<div class="stories">
  <ul
    class="stories__list"
    role="list">
    @for (story of stories(); track story.id) {
      <li
        class="story"
        [class.story--active]="story.id === activeId()">
        <button
          type="button"
          class="story__trigger"
          [attr.aria-expanded]="story.id === activeId()"
          (click)="select(story.id)">
          <img
            class="story__logo"
            [src]="story.logo"
            alt=""
            width="48"
            height="48" />
          <span class="story__heading">
            <span class="story__project">{{ story.name }}</span>
            <span
              class="story__title"
              dir="auto">
              {{ story.description }}
            </span>
          </span>
        </button>
        @if (story.id === activeId()) {
          <div class="story__details">
            <ul
              class="story__tags"
              role="list">
              @for (tag of story.tags; track tag) {
                <li class="story__tag">{{ tag }}</li>
              }
            </ul>
            <a
              class="story__link"
              [href]="story.url"
              target="_blank"
              rel="noopener noreferrer">
              {{ projects().visit(story.display) }}
            </a>
          </div>
        }
      </li>
    }
  </ul>

  <div
    #stage
    class="stories__stage">
    <div
      class="stories__chrome"
      aria-hidden="true">
      <span class="stories__dots">
        <span class="stories__dot"></span>
        <span class="stories__dot"></span>
        <span class="stories__dot"></span>
      </span>
      <span class="stories__url">{{ activeStory().page }}</span>
    </div>
    <div class="stories__screen">
      @for (story of screenStories(); track story.id) {
        <video
          #video
          class="stories__video"
          [src]="story.video"
          [poster]="story.poster"
          [controls]="showControls()"
          [attr.aria-label]="projects().recordingLabel(story.name)"
          muted
          loop
          playsinline
          preload="metadata">
        </video>
      }
    </div>
  </div>
</div>
