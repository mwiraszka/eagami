         The italic is preloaded because the hero tagline uses it on first paint;

    <!-- Resolve and apply theme + locale before Angular bootstraps so the first
         paint already shows them. Precedence: localStorage, then browser/system
         preference, then English + light defaults. Mirrors theme.service.ts and
         web-i18n.service.ts; keep them in sync. The visibility gate below masks
         the gap until hydration swaps the prerendered English for the resolved
         locale, and only engages for non-English locales. -->
    <script>
      (function () {
        var locales = [
          'en',
          'de',
          'es-ES',
          'fr-FR',
          'is',
          'nl',
          'pl',
          'pt-BR',
          'el',
          'ru',
          'uk',
          'he',
          'ar',
          'hi',
          'zh-CN',
        ];

        function resolveTheme() {
          try {
            var stored = localStorage.getItem('web-theme');
            if (stored === 'dark' || stored === 'light') return stored;
          } catch (e) {}
          try {
            if (
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            ) {
              return 'dark';
            }
          } catch (e) {}
          return 'light';
        }

        function resolveLocale() {
          try {
            var stored = localStorage.getItem('web-locale');
            if (stored && locales.indexOf(stored) !== -1) return stored;
          } catch (e) {}
          var preferred =
            (navigator.languages && navigator.languages.length
              ? navigator.languages
              : navigator.language
                ? [navigator.language]
                : []) || [];
          for (var i = 0; i < preferred.length; i++) {
            var tag = String(preferred[i] || '');
            // Exact match first (e.g. 'fr-FR')
            for (var j = 0; j < locales.length; j++) {
              if (locales[j].toLowerCase() === tag.toLowerCase()) return locales[j];
            }
            // Then language-only match (e.g. 'fr' to 'fr-FR')
            var primary = tag.split('-')[0].toLowerCase();
            for (var k = 0; k < locales.length; k++) {
              if (locales[k].toLowerCase().split('-')[0] === primary) return locales[k];
            }
          }
          return 'en';
        }

        var theme = resolveTheme();
        var locale = resolveLocale();

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('lang', locale);
        // Keep this RTL set in sync with the library's locale `dir` metadata
        // (WEB_LOCALE_DIRS); this inline script can't import it.
        document.documentElement.setAttribute(
          'dir',
          locale === 'ar' || locale === 'he' ? 'rtl' : 'ltr',
        );
        if (locale !== 'en') {
          document.documentElement.classList.add('web-locale-pending');
        }

        // Internal-link clicks before Angular boots are held back by hydration
        // event replay, so nothing in-app can indicate loading yet. Flag the
        // click so the stylesheet's CSS-only overlay shows; the app removes the
        // class once stable and its router-driven overlay takes over.
        document.addEventListener(
          'click',
          function (e) {
            if (document.documentElement.classList.contains('web-hydrated')) {
              return;
            }
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
              return;
            }
            var el = e.target;
            while (el && el.tagName !== 'A') {
              el = el.parentElement;
            }
            if (!el || (el.target && el.target !== '_self')) {
              return;
            }
            var href = el.getAttribute('href');
            if (!href || href.charAt(0) !== '/') {
              return;
            }
            document.documentElement.classList.add('web-nav-pending');
          },
          true,
        );
      })();
    </script>
    <!-- Critical theme colors inlined so background and text paint in the correct
         theme before the main stylesheet loads. Hex values must stay in sync with
         --color-bg-base / --color-text-primary in _theme.scss. `color-scheme` is
         essential: without it a dark-mode reload flashes the browser's white canvas
         before the dark background applies. -->
    <style>
      html {
        color-scheme: light;
        background-color: #ffffff;
        color: #111827;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #111827;
        color: #f9fafb;
      }

      /* Routes are prerendered in English; when the resolved locale differs, mask
         the body until the i18n service clears this class after `applyLocale()`,
         so visitors don't see an English flash. The theme background above stays
         painted through the gate, so only locale-dependent content is held back. */
      html.web-locale-pending body {
        visibility: hidden;
      }
    </style>
