    <!-- Self-hosted fonts: preload the latin subsets of DM Sans (regular +
         italic) and Syne so they're requested in the critical waterfall. The
         italic file is preloaded because the home-hero tagline uses it on
         first paint — without the preload it swaps in late and flickers.
         @font-face declarations live in styles/_fonts.scss. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/dm-sans-latin.woff2"
      crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/dm-sans-italic-latin.woff2"
      crossorigin />

      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/syne-latin.woff2"
      crossorigin />

    <!-- Apply persisted theme before Angular bootstraps to avoid flash of wrong theme -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('web-theme') === 'dark') theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Critical theme colors inlined so the page background and text render in the
         correct theme on first paint, before the main stylesheet loads. Hex values
         must stay in sync with --color-bg-base / --color-text-primary in _theme.scss.
         `color-scheme` is essential here: without it the browser paints its default
         white canvas while the document loads, so a reload in dark mode flashes
         white before the dark background applies. -->
    <style>
      html {
        color-scheme: light;
        background-color: #ffffff;
        color: #111827;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #111827;
        color: #f9fafb;
      }
    </style>
