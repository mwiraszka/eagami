<ul
  #listEl
  class="ea-tree__list"
  [class]="hostClasses()"
  role="tree"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="disabled() || null"
  (keydown)="onKeydown($event)"
  (focusin)="onTreeFocus($event)">
  @for (root of nodes(); track root.id; let i = $index) {
    <ea-tree-node
      [node]="root"
      [level]="0"
      [posInSet]="i + 1"
      [setSize]="nodes().length"
      [selectedId]="selectedId()"
      [focusedId]="focusedId()"
      [expandedIds]="expandedSet()"
      [disabled]="disabled()"
      [expandLabel]="messages().tree.expand"
      [collapseLabel]="messages().tree.collapse"
      (toggle)="onNodeToggle($event)"
      (select)="onNodeSelect($event)" />
  }
</ul>
