<div class="ea-textarea-field ea-textarea-field--{{ size() }}">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [icon]="labelIcon()"
      [help]="labelHelp()"
      [forId]="id()"
      [required]="required()"
      [optional]="optional()" />
  }

  <div
    class="ea-textarea-wrapper"
    [ngClass]="wrapperClasses()"
    [style.resize]="resize()"
    [style.min-height]="minHeightStyle()"
    [style.max-height]="maxHeight() ?? null">
    <textarea
      #textareaEl
      class="ea-textarea"
      dir="auto"
      [class.ea-textarea--typed-placeholder]="typedPlaceholderShown()"
      [id]="id()"
      [placeholder]="nativePlaceholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.aria-label]="label() || ariaLabelledby() ? null : (ariaLabel() ?? null)"
      [attr.aria-labelledby]="ariaLabelledby() ?? null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"></textarea>

    @if (typedPlaceholderShown()) {
      <ea-typed-placeholder
        class="ea-textarea-wrapper__typed-placeholder"
        [text]="typed.text()"
        [typing]="typed.typing()" />
    }
  </div>

  <ng-template #messages>
    <ea-field-messages
      [id]="id()"
      [error]="errorText()"
      [hint]="showHint() ? hint() : null" />
  </ng-template>

  @if (showCount()) {
    <div class="ea-textarea-field__footer">
      <ng-container [ngTemplateOutlet]="messages" />
      <span
        class="ea-textarea-field__count"
        [id]="id() + '-count'">
        {{ countText() }}
      </span>
    </div>
  } @else {
    <ng-container [ngTemplateOutlet]="messages" />
  }
</div>
