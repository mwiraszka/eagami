<div class="ea-textarea-field">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    class="ea-textarea-wrapper"
    [ngClass]="wrapperClasses()"
    [style.resize]="resize()"
    [style.min-height]="minHeightStyle()"
    [style.max-height.px]="maxHeight() ?? null">
    <textarea
      #textareaEl
      class="ea-textarea"
      [id]="id()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [rows]="rows()"
      [value]="value()"
      [attr.maxlength]="maxlength() ?? null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"></textarea>
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="showError() ? errorMsg() : null"
    [hint]="showHint() ? hint() : null" />
</div>
