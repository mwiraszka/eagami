<ea-popover
  [anchor]="triggerEl()"
  [open]="open()"
  [placement]="placement()"
  role="menu"
  [surfaceId]="id()"
  [ariaLabel]="resolvedAriaLabel()"
  [closeOnEscape]="false"
  scrollBehavior="reposition"
  (closeRequested)="onPopoverCloseRequested()">
  <div
    #listEl
    class="ea-menu__list"
    [style.max-height]="maxHeight()">
    <ng-content />
  </div>
</ea-popover>
