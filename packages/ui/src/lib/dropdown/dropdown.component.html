<div class="ea-dropdown-field ea-dropdown-field--{{ size() }}">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [icon]="labelIcon()"
      [forId]="id()"
      [labelId]="id() + '-label'"
      [required]="required()" />
  }

  <div class="ea-dropdown">
    <button
      #triggerEl
      type="button"
      class="ea-dropdown__trigger"
      [ngClass]="triggerClasses()"
      [id]="id()"
      role="combobox"
      [disabled]="isDisabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="isOpen() ? id() + '-listbox' : null"
      [attr.aria-activedescendant]="
        isOpen() && focusedIndex() >= 0 ? id() + '-option-' + focusedIndex() : null
      "
      [attr.aria-labelledby]="triggerLabelledBy()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (click)="toggle()"
      (keydown)="handleKeydown($event)">
      <span
        class="ea-dropdown__value"
        [class.ea-dropdown__value--placeholder]="!selectedLabel()">
        <bdi>{{ selectedLabel() || resolvedPlaceholder() }}</bdi>
      </span>
      <ea-icon-chevron-down
        class="ea-dropdown__chevron"
        [class.ea-dropdown__chevron--open]="isOpen()" />
    </button>

    <ea-popover
      [anchor]="triggerEl"
      [open]="isOpen()"
      placement="bottom-start"
      role="listbox"
      [surfaceId]="id() + '-listbox'"
      [aria-label]="label()"
      [matchAnchorWidth]="true"
      [closeOnEscape]="false"
      scrollBehavior="close"
      (closeRequested)="onPopoverCloseRequested()">
      <div
        class="ea-dropdown__menu"
        [ngClass]="menuClasses()"
        role="none">
        @for (group of renderedGroups(); track $index) {
          <div
            class="ea-dropdown__group"
            [class.ea-dropdown__group--ruled]="group.rule"
            [attr.role]="grouped() ? 'group' : 'presentation'"
            [attr.aria-label]="group.label ?? null">
            @if (group.label; as groupLabel) {
              <div
                class="ea-dropdown__group-label"
                aria-hidden="true">
                {{ groupLabel }}
              </div>
            }
            @for (entry of group.options; track entry.option.value) {
              <div
                class="ea-dropdown__option"
                [class.ea-dropdown__option--selected]="entry.option.value === value()"
                [class.ea-dropdown__option--focused]="entry.index === focusedIndex()"
                [class.ea-dropdown__option--disabled]="entry.option.disabled"
                [id]="id() + '-option-' + entry.index"
                role="option"
                [attr.aria-selected]="entry.index === selectedIndex()"
                [attr.aria-disabled]="entry.option.disabled || null"
                (click)="select(entry.option)"
                (mouseenter)="focusedIndex.set(entry.index)">
                {{ entry.option.label }}
              </div>
            }
          </div>
        }
      </div>
    </ea-popover>
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
