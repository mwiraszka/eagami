<div class="ea-dropdown-field">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [labelId]="id() + '-label'"
      [required]="required()" />
  }

  <div class="ea-dropdown">
    <button
      #triggerEl
      type="button"
      class="ea-dropdown__trigger"
      [ngClass]="triggerClasses()"
      [id]="id()"
      role="combobox"
      [disabled]="isDisabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="isOpen() ? id() + '-listbox' : null"
      [attr.aria-activedescendant]="
        isOpen() && focusedIndex() >= 0 ? id() + '-option-' + focusedIndex() : null
      "
      [attr.aria-labelledby]="label() ? id() + '-label ' + id() : null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (click)="toggle()"
      (keydown)="handleKeydown($event)">
      <span
        class="ea-dropdown__value"
        [class.ea-dropdown__value--placeholder]="!selectedLabel()">
        <bdi>{{ selectedLabel() || resolvedPlaceholder() }}</bdi>
      </span>
      <ea-icon-chevron-down
        class="ea-dropdown__chevron"
        [class.ea-dropdown__chevron--open]="isOpen()" />
    </button>

    <ea-popover
      [anchor]="triggerEl"
      [open]="isOpen()"
      placement="bottom-start"
      role="listbox"
      [surfaceId]="id() + '-listbox'"
      [aria-label]="label()"
      [matchAnchorWidth]="true"
      [closeOnEscape]="false"
      scrollBehavior="close"
      (closeRequested)="onPopoverCloseRequested()">
      <div
        class="ea-dropdown__menu"
        [ngClass]="menuClasses()"
        role="none">
        @for (option of options(); track option.value; let i = $index) {
          <div
            class="ea-dropdown__option"
            [class.ea-dropdown__option--selected]="option.value === value()"
            [class.ea-dropdown__option--focused]="i === focusedIndex()"
            [class.ea-dropdown__option--disabled]="option.disabled"
            [id]="id() + '-option-' + i"
            role="option"
            [attr.aria-selected]="option.value === value()"
            [attr.aria-disabled]="option.disabled || null"
            (click)="select(option)"
            (mouseenter)="focusedIndex.set(i)">
            {{ option.label }}
          </div>
        }
      </div>
    </ea-popover>
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
