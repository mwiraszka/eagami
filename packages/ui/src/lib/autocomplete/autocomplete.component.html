<div class="ea-autocomplete">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    #anchorEl
    class="ea-autocomplete__wrapper"
    [ngClass]="wrapperClasses()">
    <span class="ea-autocomplete__prefix">
      <ng-content select="[slot=prefix]" />
    </span>

    <input
      #inputEl
      class="ea-autocomplete__input"
      type="text"
      dir="auto"
      autocomplete="off"
      role="combobox"
      [id]="id()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-autocomplete]="'list'"
      [attr.aria-controls]="id() + '-listbox'"
      [attr.aria-activedescendant]="
        focusedIndex() >= 0 ? id() + '-option-' + focusedIndex() : null
      "
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
      (keydown)="handleKeydown($event)" />

    <span class="ea-autocomplete__suffix">
      <ng-content select="[slot=suffix]" />
    </span>
  </div>

  <ea-popover
    [anchor]="anchorEl"
    [open]="showList()"
    placement="bottom-start"
    role="listbox"
    [surfaceId]="id() + '-listbox'"
    [matchAnchorWidth]="true"
    [closeOnEscape]="false"
    scrollBehavior="close"
    (closeRequested)="close()">
    <div
      class="ea-autocomplete__listbox"
      [ngClass]="listboxClasses()">
      @for (option of filteredOptions(); track option.value; let i = $index) {
        <div
          class="ea-autocomplete__option"
          role="option"
          [id]="id() + '-option-' + i"
          [class.ea-autocomplete__option--focused]="i === focusedIndex()"
          [class.ea-autocomplete__option--disabled]="option.disabled"
          [attr.aria-selected]="i === focusedIndex()"
          [attr.aria-disabled]="option.disabled || null"
          (mousedown)="selectOption(option)"
          (mouseenter)="focusedIndex.set(i)">
          {{ option.label }}
        </div>
      }
      @if (showEmpty()) {
        <div
          class="ea-autocomplete__empty"
          role="presentation">
          {{ resolvedEmptyMessage() }}
        </div>
      }
    </div>
  </ea-popover>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
