<div class="ea-autocomplete ea-autocomplete--{{ size() }}">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    #anchorEl
    class="ea-autocomplete__wrapper"
    [ngClass]="wrapperClasses()">
    <span class="ea-autocomplete__prefix">
      <ng-content select="[slot=prefix]" />
    </span>

    <input
      #inputEl
      class="ea-autocomplete__input"
      type="text"
      dir="auto"
      autocomplete="off"
      role="combobox"
      [id]="id()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.aria-label]="label() ? null : ariaLabel()"
      [attr.aria-expanded]="showList()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-autocomplete]="'list'"
      [attr.aria-controls]="id() + '-listbox'"
      [attr.aria-activedescendant]="
        focusedIndex() >= 0 ? id() + '-option-' + focusedIndex() : null
      "
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)"
      (keydown)="handleKeydown($event)" />

    <span class="ea-autocomplete__suffix">
      <ng-content select="[slot=suffix]" />
    </span>
  </div>

  <ea-popover
    [anchor]="anchorEl"
    [open]="showList()"
    placement="bottom-start"
    role="listbox"
    [aria-label]="label() ?? ariaLabel()"
    [surfaceId]="id() + '-listbox'"
    [matchAnchorWidth]="true"
    [closeOnEscape]="false"
    scrollBehavior="close"
    (closeRequested)="close()">
    <div
      class="ea-autocomplete__listbox"
      [ngClass]="listboxClasses()">
      @for (group of renderedGroups(); track $index) {
        <div
          class="ea-autocomplete__group"
          [class.ea-autocomplete__group--ruled]="group.rule"
          [attr.role]="grouped() ? 'group' : 'presentation'"
          [attr.aria-label]="group.label ?? null">
          @if (group.label; as groupLabel) {
            <div
              class="ea-autocomplete__group-label"
              aria-hidden="true">
              {{ groupLabel }}
            </div>
          }
          @for (entry of group.options; track entry.option.value) {
            <div
              class="ea-autocomplete__option"
              role="option"
              [id]="id() + '-option-' + entry.index"
              [class.ea-autocomplete__option--focused]="entry.index === focusedIndex()"
              [class.ea-autocomplete__option--disabled]="entry.option.disabled"
              [attr.aria-selected]="entry.index === selectedIndex()"
              [attr.aria-disabled]="entry.option.disabled || null"
              (mousedown)="selectOption(entry.option)"
              (mouseenter)="focusedIndex.set(entry.index)">
              {{ entry.option.label }}
            </div>
          }
        </div>
      }
      @if (showEmpty()) {
        <div
          class="ea-autocomplete__empty"
          role="status">
          {{ resolvedEmptyMessage() }}
        </div>
      }
    </div>
  </ea-popover>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
