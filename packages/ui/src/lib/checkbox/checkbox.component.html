<div class="ea-checkbox-field">
  <label
    class="ea-checkbox"
    [ngClass]="hostClasses()"
    [for]="id()">
    <input
      #inputEl
      type="checkbox"
      class="ea-checkbox__input"
      [id]="id()"
      [checked]="checked()"
      [disabled]="isDisabled()"
      [required]="required()"
      [indeterminate]="indeterminate()"
      [attr.aria-checked]="indeterminate() ? 'mixed' : checked()"
      [attr.aria-label]="!label() ? (ariaLabel() ?? null) : null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (change)="handleChange()" />

    <span
      class="ea-checkbox__box"
      aria-hidden="true">
      @if (indeterminate()) {
        <svg
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 8h8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round" />
        </svg>
      } @else if (checked()) {
        <svg
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3.5 8.5L6.5 11.5L12.5 4.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      }
    </span>

    @if (label()) {
      <span
        class="ea-checkbox__label"
        [class.ea-checkbox__label--required]="required()">
        {{ label() }}
      </span>
    }
  </label>

  @if (showError()) {
    <p
      class="ea-checkbox-field__message ea-checkbox-field__message--error"
      [id]="id() + '-error'"
      role="alert">
      {{ errorMsg() }}
    </p>
  }

  @if (showHint()) {
    <p
      class="ea-checkbox-field__message ea-checkbox-field__message--hint"
      [id]="id() + '-hint'">
      {{ hint() }}
    </p>
  }
</div>
