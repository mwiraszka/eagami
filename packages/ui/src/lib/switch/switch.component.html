<div class="ea-switch-field">
  <label
    class="ea-switch"
    [ngClass]="hostClasses()">
    <input
      class="ea-switch__input"
      type="checkbox"
      role="switch"
      [id]="id()"
      [checked]="checked()"
      [disabled]="isDisabled()"
      [required]="required()"
      [attr.aria-checked]="checked()"
      [attr.aria-label]="!label() ? (ariaLabel() ?? null) : null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (change)="handleChange()" />
    <span class="ea-switch__track">
      <span class="ea-switch__thumb"></span>
    </span>
    @if (label()) {
      <span
        class="ea-switch__label"
        [class.ea-switch__label--required]="required()">
        {{ label() }}
      </span>
    }
  </label>

  @if (showError()) {
    <p
      class="ea-switch-field__message ea-switch-field__message--error"
      [id]="id() + '-error'"
      role="alert">
      <ea-icon-alert-circle class="ea-switch-field__message-icon" />
      {{ errorMsg() }}
    </p>
  }

  @if (showHint()) {
    <p
      class="ea-switch-field__message ea-switch-field__message--hint"
      [id]="id() + '-hint'">
      {{ hint() }}
    </p>
  }
</div>
