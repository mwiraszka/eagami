<div class="ea-code-input-field">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [labelId]="id() + '-label'"
      [required]="required()" />
  }

  <div
    class="ea-code-input-group"
    [class.ea-code-input-group--xs]="size() === 'xs'"
    [class.ea-code-input-group--sm]="size() === 'sm'"
    [class.ea-code-input-group--md]="size() === 'md'"
    [class.ea-code-input-group--lg]="size() === 'lg'"
    [class.ea-code-input-group--xl]="size() === 'xl'"
    [class.ea-code-input-group--error]="hasError()"
    [class.ea-code-input-group--disabled]="isDisabled()"
    role="group"
    [attr.aria-labelledby]="label() ? id() + '-label' : null"
    [attr.aria-label]="!label() ? i18n.messages().codeInput.groupLabel(length()) : null"
    [attr.aria-describedby]="
      showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
    ">
    @for (i of indices(); track i) {
      <input
        #digitEl
        dir="auto"
        class="ea-code-input"
        [class.ea-code-input--focused]="focusedIndex() === i"
        [class.ea-code-input--filled]="digits()[i] !== ''"
        type="text"
        [attr.inputmode]="allowAllChars() ? 'text' : 'numeric'"
        autocomplete="one-time-code"
        maxlength="1"
        [disabled]="isDisabled()"
        [readOnly]="readonly()"
        [required]="required()"
        [value]="digits()[i]"
        [placeholder]="placeholders()[i]"
        [attr.aria-label]="i18n.messages().codeInput.digitLabel(i + 1, length())"
        [attr.aria-invalid]="hasError() || null"
        (input)="handleInput($event, i)"
        (keydown)="handleKeydown($event, i)"
        (paste)="handlePaste($event)"
        (focus)="handleFocus(i)"
        (blur)="handleBlur()" />
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
