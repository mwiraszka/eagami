<div
  class="ea-slider-field"
  [ngClass]="hostClasses()">
  @if (label() || showValue()) {
    <div class="ea-slider-field__header">
      @if (label(); as labelText) {
        <ea-field-label
          [text]="labelText"
          [labelId]="id() + '-label'"
          [required]="required()" />
      }
      @if (showValue()) {
        <span class="ea-slider-field__value">
          {{ formatDisplay(clampedValue()) }}
        </span>
      }
    </div>
  }

  <div class="ea-slider">
    <div
      #trackEl
      class="ea-slider__track"
      (pointerdown)="handlePointerDown($event)"
      (pointermove)="handlePointerMove($event)"
      (pointerup)="handlePointerUp($event)"
      (pointercancel)="handlePointerUp($event)"
      (lostpointercapture)="handlePointerUp($event)">
      <div
        class="ea-slider__fill"
        [style.width.%]="percent()">
      </div>
      @for (tick of tickPercents(); track $index) {
        <span
          class="ea-slider__tick"
          aria-hidden="true"
          [style.inset-inline-start.%]="tick">
        </span>
      }
      <div
        class="ea-slider__thumb"
        role="slider"
        tabindex="0"
        [id]="id()"
        [attr.aria-labelledby]="label() ? id() + '-label' : null"
        [attr.aria-label]="!label() ? (ariaLabel() ?? null) : null"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="clampedValue()"
        [attr.aria-valuetext]="formatDisplay(clampedValue())"
        [attr.aria-disabled]="isDisabled() || null"
        [attr.aria-required]="required() || null"
        [attr.aria-invalid]="errored() || null"
        [attr.aria-describedby]="
          showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
        "
        [style.inset-inline-start.%]="percent()"
        (keydown)="handleKeydown($event)"
        (blur)="handleBlur()">
      </div>
    </div>

    @if (showMinMaxLabels()) {
      <div class="ea-slider__minmax">
        <span class="ea-slider__minmax-label">
          {{ formatDisplay(min()) }}
        </span>
        <span class="ea-slider__minmax-label">
          {{ formatDisplay(max()) }}
        </span>
      </div>
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
