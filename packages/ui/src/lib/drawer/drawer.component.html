<dialog
  #drawerEl
  class="ea-drawer"
  [class.ea-drawer--animated]="animation() !== 'none'"
  [class.ea-drawer--linear]="animation() === 'linear'"
  [class.ea-drawer--push]="mode() === 'push'"
  [id]="id()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="!ariaLabel() ? id() + '-header' : null"
  (click)="handleBackdropClick($event)"
  (cancel)="handleCancel($event)"
  (keydown)="handleKeydown($event)"
  (close)="onDialogClose()">
  <div
    #panelEl
    class="ea-drawer__panel"
    [ngClass]="panelClasses()">
    @if (showClose()) {
      <button
        type="button"
        class="ea-drawer__close"
        [attr.aria-label]="i18n.messages().drawer.close"
        (click)="handleClose()">
        <ea-icon-x />
      </button>
    }

    <div
      class="ea-drawer__header"
      [id]="id() + '-header'">
      <ng-content select="[slot=header]" />
    </div>

    <div class="ea-drawer__body">
      <ng-content />
    </div>

    <div class="ea-drawer__footer">
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</dialog>
