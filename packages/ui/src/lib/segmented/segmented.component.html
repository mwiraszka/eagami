<div
  class="ea-segmented-field"
  [class.ea-segmented-field--full-width]="fullWidth()">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [labelId]="id() + '-label'"
      [required]="required()" />
  }

  <div
    class="ea-segmented"
    role="radiogroup"
    [ngClass]="hostClasses()"
    [attr.aria-labelledby]="label() ? id() + '-label' : null"
    [attr.aria-label]="!label() ? (ariaLabel() ?? null) : null"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-disabled]="isDisabled() || null"
    [attr.aria-describedby]="
      showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
    ">
    @for (option of options(); track option.value; let i = $index) {
      <button
        #optionEl
        type="button"
        class="ea-segmented__option"
        role="radio"
        [class.ea-segmented__option--selected]="isSelected(option)"
        [class.ea-segmented__option--disabled]="isOptionDisabled(option)"
        [attr.aria-checked]="isSelected(option)"
        [attr.aria-disabled]="isOptionDisabled(option) || null"
        [disabled]="isOptionDisabled(option)"
        [attr.tabindex]="isSelected(option) || (!value() && i === 0) ? 0 : -1"
        (click)="select(option)"
        (keydown)="handleKeydown($event, i)">
        {{ option.label }}
      </button>
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="showError() ? errorMsg() : null"
    [hint]="showHint() ? hint() : null" />
</div>
