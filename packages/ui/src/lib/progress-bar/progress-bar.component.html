<div
  class="ea-progress-bar"
  [ngClass]="hostClasses()">
  @if (label() || showsPercentage()) {
    <div class="ea-progress-bar__header">
      @if (label()) {
        <span class="ea-progress-bar__label">
          {{ label() }}
        </span>
      }
      @if (showsPercentage() && !indeterminate()) {
        <span class="ea-progress-bar__value">
          <bdi>{{ percentageRounded() }}%</bdi>
        </span>
      }
    </div>
  }
  <div
    class="ea-progress-bar__track"
    role="progressbar"
    [attr.aria-valuenow]="indeterminate() ? null : percentageRounded()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-busy]="indeterminate() || null"
    [attr.aria-label]="label() || i18n.messages().progressBar.label">
    @if (bufferPercentage() !== null && !indeterminate()) {
      <div
        class="ea-progress-bar__buffer"
        [style.width]="bufferPercentage() + '%'">
      </div>
    }
    <div
      class="ea-progress-bar__fill"
      [style.width]="indeterminate() ? null : percentage() + '%'">
    </div>
  </div>
</div>
