<div
  class="ea-stepper"
  [ngClass]="hostClasses()">
  <div
    class="ea-stepper__list"
    role="tablist"
    [attr.aria-label]="i18n.messages().stepper.stepsLabel"
    [attr.aria-orientation]="orientation()"
    (keydown)="handleKeydown($event)">
    @for (step of registeredSteps(); let i = $index; track step) {
      <button
        type="button"
        role="tab"
        class="ea-stepper__button"
        [class.ea-stepper__button--active]="i === activeStep()"
        [class.ea-stepper__button--completed]="step.completed()"
        [id]="step.id() + '-tab'"
        [attr.aria-controls]="i === activeStep() ? step.id() + '-panel' : null"
        [attr.aria-selected]="i === activeStep()"
        [disabled]="!canNavigateTo(i)"
        [tabindex]="i === activeStep() ? 0 : -1"
        (click)="selectStep(i)">
        <span
          class="ea-stepper__circle"
          aria-hidden="true">
          @if (step.completed()) {
            <ea-icon-check />
          } @else {
            {{ i + 1 }}
          }
        </span>
        <span class="ea-stepper__label">
          {{ step.label() }}
          @if (step.optional()) {
            <span class="ea-stepper__optional">
              ({{ i18n.messages().stepper.optional }})
            </span>
          }
        </span>
        @if (step.completed()) {
          <span class="ea-stepper__completed-label">
            {{ i18n.messages().stepper.stepCompleted }}
          </span>
        }
      </button>
      @if (i < registeredSteps().length - 1) {
        <span
          class="ea-stepper__connector"
          [class.ea-stepper__connector--completed]="step.completed()"
          aria-hidden="true">
        </span>
      }
    }
  </div>
  <ng-content />
</div>
