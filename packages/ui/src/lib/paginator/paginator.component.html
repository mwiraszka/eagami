<div
  class="ea-paginator"
  [ngClass]="'ea-paginator--' + size()"
  [class.ea-paginator--left]="align() === 'left'"
  [class.ea-paginator--center]="align() === 'center'"
  [class.ea-paginator--disabled]="disabled()"
  role="navigation"
  [attr.aria-label]="i18n.messages().paginator.label">
  @if (showPageSizeSelector()) {
    <div class="ea-paginator__page-size">
      <label
        class="ea-paginator__label"
        dir="auto"
        for="ea-paginator-size">
        {{ i18n.messages().paginator.rowsPerPage }}
      </label>
      <select
        class="ea-paginator__select"
        id="ea-paginator-size"
        [disabled]="disabled()"
        (change)="onPageSizeChange($event)">
        @for (option of pageSizeOptions(); track option) {
          <option
            [value]="option"
            [selected]="option === pageSize()">
            {{ formatNumber(option) }}
          </option>
        }
      </select>
    </div>
  }

  @if (showRangeLabel()) {
    <span
      class="ea-paginator__range"
      dir="auto">
      {{
        i18n
          .messages()
          .paginator.range(
            formatNumber(rangeStart()),
            formatNumber(rangeEnd()),
            formatNumber(totalItems())
          )
      }}
    </span>
  }

  <div class="ea-paginator__controls">
    <ea-button
      variant="ghost"
      [size]="size()"
      [disabled]="disabled() || !canGoPrev()"
      [aria-label]="i18n.messages().paginator.previousPage"
      (clicked)="prevPage()">
      <ea-icon-chevron-left class="ea-rtl-flip" />
    </ea-button>

    @for (p of visiblePages(); track $index) {
      @if (p === 'ellipsis') {
        <span class="ea-paginator__ellipsis">…</span>
      } @else {
        <ea-button
          class="ea-paginator__page-btn"
          [class.ea-paginator__page-btn--active]="p === page()"
          variant="ghost"
          [size]="size()"
          [disabled]="disabled()"
          [aria-current]="p === page() ? 'page' : undefined"
          (clicked)="goToPage(p)">
          {{ formatNumber(p) }}
        </ea-button>
      }
    }

    <ea-button
      variant="ghost"
      [size]="size()"
      [disabled]="disabled() || !canGoNext()"
      [aria-label]="i18n.messages().paginator.nextPage"
      (clicked)="nextPage()">
      <ea-icon-chevron-right class="ea-rtl-flip" />
    </ea-button>
  </div>
</div>
