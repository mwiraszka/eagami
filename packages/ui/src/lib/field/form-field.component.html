<div class="ea-form-field ea-form-field--{{ size() }}">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [icon]="labelIcon()"
      [forId]="controlId()"
      [required]="required()" />
  }

  <ng-content />

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
