@if (forId(); as control) {
  <label
    class="ea-field-label"
    [for]="control"
    [attr.id]="labelId() ?? null"
    [class.ea-field-label--required]="required()">
    <ng-container [ngTemplateOutlet]="content" />
  </label>
} @else {
  <span
    class="ea-field-label"
    [attr.id]="labelId() ?? null"
    [class.ea-field-label--required]="required()">
    <ng-container [ngTemplateOutlet]="content" />
  </span>
}

<ng-template #content>
  @if (icon(); as iconComponent) {
    <span
      class="ea-field-label__icon"
      aria-hidden="true">
      <ng-container *ngComponentOutlet="iconComponent" />
    </span>
  }
  {{ text() }}
</ng-template>
