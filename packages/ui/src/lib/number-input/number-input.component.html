<div
  class="ea-number-input-field ea-number-input-field--{{ size() }}"
  [style.--ea-number-input-chars]="maxDigits()">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    class="ea-number-input-wrapper"
    [ngClass]="wrapperClasses()">
    <input
      #inputEl
      type="number"
      class="ea-number-input"
      dir="auto"
      [id]="id()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [attr.min]="effectiveMin() ?? null"
      [attr.max]="max() ?? null"
      [attr.step]="step()"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput()"
      (keydown)="handleKeydown($event)"
      (wheel)="handleWheel($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)" />
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
