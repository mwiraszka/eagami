@if (visible()) {
  <div
    class="ea-alert"
    [ngClass]="alertClasses()"
    [attr.role]="role()">
    <span
      class="ea-alert__icon"
      aria-hidden="true">
      @if (icon(); as customIcon) {
        <ng-container *ngComponentOutlet="customIcon" />
      } @else {
        @switch (variant()) {
          @case ('success') {
            <ea-icon-check />
          }
          @case ('warning') {
            <ea-icon-alert-circle />
          }
          @case ('error') {
            <ea-icon-alert-circle />
          }
          @case ('info') {
            <ea-icon-info />
          }
          @default {
            <ea-icon-info />
          }
        }
      }
    </span>
    <div class="ea-alert__content">
      <ng-content />
    </div>
    @if (dismissible()) {
      <button
        class="ea-alert__close"
        type="button"
        [attr.aria-label]="i18n.messages().alert.dismiss"
        (click)="dismiss()">
        <ea-icon-x />
      </button>
    }
  </div>
}
