<div class="ea-date-picker-field">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [labelId]="id() + '-label'"
      [required]="required()" />
  }

  <div class="ea-date-picker">
    <div
      class="ea-date-picker__trigger-wrapper"
      [ngClass]="wrapperClasses()">
      <button
        #triggerEl
        type="button"
        class="ea-date-picker__trigger"
        [ngClass]="triggerClasses()"
        [id]="id()"
        [disabled]="isDisabled()"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-haspopup]="'dialog'"
        [attr.aria-controls]="isOpen() ? dialogId() : null"
        [attr.aria-labelledby]="triggerLabelledBy()"
        [attr.aria-required]="required() || null"
        [attr.aria-invalid]="hasError() || null"
        [attr.aria-describedby]="
          showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
        "
        (click)="toggle()"
        (keydown)="handleTriggerKeydown($event)">
        <ea-icon-calendar
          class="ea-date-picker__trigger-icon"
          aria-hidden="true" />
        <span
          class="ea-date-picker__trigger-value"
          [class.ea-date-picker__trigger-value--placeholder]="!displayValue()">
          <bdi>{{ displayValue() || resolvedPlaceholder() }}</bdi>
        </span>
      </button>
      @if (value() && !isDisabled() && !readonly()) {
        <button
          type="button"
          class="ea-date-picker__clear"
          [attr.aria-label]="i18n.messages().datePicker.clear"
          (click)="clear($event)">
          <ea-icon-x
            class="ea-date-picker__clear-icon"
            aria-hidden="true" />
        </button>
      }
    </div>

    <ea-popover
      [anchor]="triggerEl"
      [open]="isOpen()"
      placement="bottom-start"
      role="dialog"
      [surfaceId]="dialogId()"
      [aria-label]="i18n.messages().datePicker.dialogLabel"
      [trapFocus]="true"
      [closeOnEscape]="false"
      scrollBehavior="close"
      (closeRequested)="onPopoverCloseRequested()">
      <div
        class="ea-date-picker__popover"
        [ngClass]="popoverClasses()"
        (keydown)="handleGridKeydown($event)">
        <div class="ea-date-picker__header">
          <button
            type="button"
            class="ea-date-picker__nav-btn"
            [attr.aria-label]="i18n.messages().datePicker.previousYear"
            (click)="goToPrevYear()">
            <ea-icon-chevron-left
              class="ea-rtl-flip"
              aria-hidden="true" />
            <ea-icon-chevron-left
              class="ea-rtl-flip"
              aria-hidden="true" />
          </button>
          <button
            type="button"
            class="ea-date-picker__nav-btn"
            [attr.aria-label]="i18n.messages().datePicker.previousMonth"
            (click)="goToPrevMonth()">
            <ea-icon-chevron-left
              class="ea-rtl-flip"
              aria-hidden="true" />
          </button>
          <span
            class="ea-date-picker__month-label"
            aria-live="polite">
            {{ monthYearLabel() }}
          </span>
          <button
            type="button"
            class="ea-date-picker__nav-btn"
            [attr.aria-label]="i18n.messages().datePicker.nextMonth"
            (click)="goToNextMonth()">
            <ea-icon-chevron-right
              class="ea-rtl-flip"
              aria-hidden="true" />
          </button>
          <button
            type="button"
            class="ea-date-picker__nav-btn"
            [attr.aria-label]="i18n.messages().datePicker.nextYear"
            (click)="goToNextYear()">
            <ea-icon-chevron-right
              class="ea-rtl-flip"
              aria-hidden="true" />
            <ea-icon-chevron-right
              class="ea-rtl-flip"
              aria-hidden="true" />
          </button>
        </div>

        <div
          class="ea-date-picker__grid"
          role="grid">
          <div
            class="ea-date-picker__weekday-row"
            role="row">
            @for (label of weekdayLabels(); track label) {
              <div
                class="ea-date-picker__weekday"
                role="columnheader">
                {{ label }}
              </div>
            }
          </div>
          @for (week of weeks(); track $index) {
            <div
              class="ea-date-picker__week"
              role="row">
              @for (day of week; track day.date.getTime()) {
                <div
                  class="ea-date-picker__cell"
                  role="gridcell"
                  [attr.aria-selected]="day.isSelected">
                  <button
                    type="button"
                    class="ea-date-picker__day"
                    [class.ea-date-picker__day--outside]="!day.isCurrentMonth"
                    [class.ea-date-picker__day--today]="day.isToday"
                    [class.ea-date-picker__day--selected]="day.isSelected"
                    [class.ea-date-picker__day--focused]="day.isFocused"
                    [class.ea-date-picker__day--disabled]="day.isDisabled"
                    [attr.aria-disabled]="day.isDisabled || null"
                    [attr.aria-current]="day.isToday ? 'date' : null"
                    [attr.tabindex]="day.isFocused ? 0 : -1"
                    (click)="selectDay(day)">
                    {{ day.day }}
                  </button>
                </div>
              }
            </div>
          }
        </div>

        <div class="ea-date-picker__footer">
          <button
            type="button"
            class="ea-date-picker__today-btn"
            (click)="goToToday()">
            {{ i18n.messages().datePicker.today }}
          </button>
        </div>
      </div>
    </ea-popover>
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
