<div
  #containerEl
  [class]="containerClass()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="ea-toast ea-toast--{{ toast.variant }} ea-toast--{{ size() }}"
      [attr.role]="toastRole(toast.variant)">
      @if (toast.icon !== undefined) {
        @if (toast.icon) {
          <span
            class="ea-toast__icon"
            aria-hidden="true">
            <ng-container *ngComponentOutlet="toast.icon" />
          </span>
        }
      } @else {
        @switch (toast.variant) {
          @case ('success') {
            <ea-icon-check-circle class="ea-toast__icon" />
          }
          @case ('info') {
            <ea-icon-info class="ea-toast__icon" />
          }
          @case ('warning') {
            <ea-icon-alert-triangle class="ea-toast__icon" />
          }
          @case ('error') {
            <ea-icon-alert-circle class="ea-toast__icon" />
          }
        }
      }
      <span class="ea-toast__message">{{ toast.message }}</span>
      @if (clearable()) {
        <button
          class="ea-toast__close"
          type="button"
          [attr.aria-label]="i18n.messages().toast.dismiss"
          (click)="toastService.dismiss(toast.id)">
          <ea-icon-x />
        </button>
      }
    </div>
  }
</div>
