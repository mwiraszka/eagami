@if (toastService.toasts().length) {
  <div
    [class]="containerClass()"
    aria-live="polite"
    aria-atomic="false">
    @for (toast of toastService.toasts(); track toast.id) {
      <div
        class="ea-toast ea-toast--{{ toast.variant }}"
        [attr.role]="getRole(toast)"
        [attr.aria-live]="getRole(toast) === 'alert' ? 'assertive' : 'polite'">
        <span class="ea-toast__message">{{ toast.message }}</span>
        @if (clearable()) {
          <button
            class="ea-toast__close"
            type="button"
            [attr.aria-label]="i18n.messages().toast.dismiss"
            (click)="toastService.dismiss(toast.id)">
            <ea-icon-x />
          </button>
        }
      </div>
    }
  </div>
}
