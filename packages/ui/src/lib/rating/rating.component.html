<div
  class="ea-rating-field"
  [ngClass]="hostClasses()">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    #starsEl
    class="ea-rating-field__stars"
    role="slider"
    tabindex="0"
    [id]="id()"
    [attr.aria-label]="resolvedAriaLabel()"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuetext]="starAriaLabel(value())"
    [attr.aria-readonly]="readonly() ? true : null"
    [attr.aria-disabled]="isDisabled() ? true : null"
    [attr.aria-describedby]="describedBy()"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (pointerleave)="onPointerLeave()">
    @for (pos of positions(); track pos) {
      <!--
        Stars are presentational click targets. The parent
        `<div role="slider">` is the canonical interactive element (keyboard
        and AT navigation flows through it); using `<button>` here would
        nest two interactive controls and trip axe's `nested-interactive`.
      -->
      <span
        role="presentation"
        class="ea-rating-field__star"
        [class.ea-rating-field__star--full]="stateFor(pos) === 'full'"
        [class.ea-rating-field__star--half]="stateFor(pos) === 'half'"
        [class.ea-rating-field__star--empty]="stateFor(pos) === 'empty'"
        [class.ea-rating-field__star--inert]="!isInteractive()"
        (pointermove)="onPointerMove($event, pos)"
        (click)="onClick($event, pos)">
        <!--
          Background layer is always rendered as the dim full-star outline so
          empty positions show a visible silhouette and half positions reveal
          the unfilled side behind the foreground. Thinner stroke keeps the
          outline visually quiet against the filled foreground.
        -->
        <span
          class="ea-rating-field__star-icon ea-rating-field__star-icon--background"
          aria-hidden="true">
          <ng-container *ngComponentOutlet="iconClass(); inputs: { strokeWidth: 1.5 }" />
        </span>
        @if (stateFor(pos) !== 'empty') {
          <span
            class="ea-rating-field__star-icon ea-rating-field__star-icon--foreground"
            aria-hidden="true">
            <ng-container
              *ngComponentOutlet="
                stateFor(pos) === 'half' ? halfIconClass() : iconClass()
              " />
          </span>
        }
      </span>
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="showError() ? errorMsg() : null"
    [hint]="showHint() ? hint() : null" />
</div>
