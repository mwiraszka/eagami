<span
  class="ea-tag"
  [ngClass]="hostClasses()"
  [style.--ea-tag-max-width]="maxWidth() ?? null"
  [style.--ea-tag-color]="resolvedColor()"
  [style.--ea-tag-ink]="resolvedInk()"
  [eaTooltip]="labelTooltip()"
  [tooltipPosition]="tooltipPosition()">
  @if (icon(); as iconComponent) {
    <span
      class="ea-tag__icon"
      aria-hidden="true">
      <ng-container *ngComponentOutlet="iconComponent" />
    </span>
  }
  <span
    #labelEl
    class="ea-tag__label">
    <ng-content />
  </span>
  @if (removable()) {
    <button
      type="button"
      class="ea-tag__remove"
      [disabled]="disabled() || null"
      [attr.tabindex]="removeTabbable() ? null : -1"
      [attr.aria-label]="resolvedRemoveLabel()"
      (click)="onRemove($event)">
      <ea-icon-x />
    </button>
  }
</span>
