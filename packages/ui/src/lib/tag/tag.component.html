<span
  class="ea-tag"
  dir="auto"
  [ngClass]="hostClasses()">
  <ng-content />
  @if (removable()) {
    <button
      type="button"
      class="ea-tag__remove"
      [disabled]="disabled() || null"
      [attr.aria-label]="resolvedRemoveLabel()"
      (click)="onRemove($event)">
      <ea-icon-x />
    </button>
  }
</span>
