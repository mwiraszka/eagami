<div class="ea-input-field ea-input-field--{{ size() }}">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    class="ea-input-wrapper"
    [ngClass]="wrapperClasses()"
    [style.max-width]="numberWidth()">
    @if (!value() && icon(); as leadingIcon) {
      <span
        class="ea-input-wrapper__icon"
        aria-hidden="true">
        <ng-container *ngComponentOutlet="leadingIcon" />
      </span>
    }

    <span class="ea-input-wrapper__prefix">
      <ng-content select="[slot=prefix]" />
    </span>

    <input
      #inputEl
      class="ea-input"
      dir="auto"
      [id]="id()"
      [type]="effectiveType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.list]="list() ?? null"
      [attr.min]="type() === 'number' ? (min() ?? null) : null"
      [attr.max]="type() === 'number' ? (max() ?? null) : null"
      [attr.step]="type() === 'number' ? (step() ?? null) : null"
      [attr.maxlength]="maxLength() ?? null"
      [attr.minlength]="minLength() ?? null"
      [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (keydown)="handleKeydown($event)"
      (wheel)="handleWheel($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)" />

    <span class="ea-input-wrapper__suffix">
      <ng-content select="[slot=suffix]" />
    </span>

    @if (showClear()) {
      <button
        type="button"
        class="ea-input-wrapper__clear"
        [attr.aria-label]="i18n.messages().input.clear"
        (mousedown)="onClearMousedown($event)"
        (click)="clear()">
        <ea-icon-x class="ea-input-wrapper__clear-icon" />
      </button>
    }

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        class="ea-input-wrapper__password-toggle"
        [attr.aria-label]="
          passwordVisible()
            ? i18n.messages().input.hidePassword
            : i18n.messages().input.showPassword
        "
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()">
        @if (passwordVisible()) {
          <ea-icon-eye-off />
        } @else {
          <ea-icon-eye />
        }
      </button>
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="errorText()"
    [hint]="showHint() ? hint() : null" />
</div>
