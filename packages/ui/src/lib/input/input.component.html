<div class="ea-input-field">
  @if (label()) {
    <label
      class="ea-input-field__label"
      [for]="id()"
      [class.ea-input-field__label--required]="required()">
      {{ label() }}
    </label>
  }

  <div
    class="ea-input-wrapper"
    [ngClass]="wrapperClasses()">
    <span class="ea-input-wrapper__prefix">
      <ng-content select="[slot=prefix]" />
    </span>

    <input
      #inputEl
      class="ea-input"
      [id]="id()"
      [type]="effectiveType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.list]="list() ?? null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)" />

    <span class="ea-input-wrapper__suffix">
      <ng-content select="[slot=suffix]" />
    </span>

    @if (showClear()) {
      <button
        type="button"
        class="ea-input-wrapper__clear"
        [attr.aria-label]="i18n.messages().input.clear"
        (mousedown)="clear($event)">
        <ea-icon-x class="ea-input-wrapper__clear-icon" />
      </button>
    }

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        class="ea-input-wrapper__password-toggle"
        [attr.aria-label]="
          passwordVisible()
            ? i18n.messages().input.hidePassword
            : i18n.messages().input.showPassword
        "
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()">
        @if (passwordVisible()) {
          <ea-icon-eye-off />
        } @else {
          <ea-icon-eye />
        }
      </button>
    }
  </div>

  @if (showError()) {
    <p
      class="ea-input-field__message ea-input-field__message--error"
      [id]="id() + '-error'"
      role="alert">
      <ea-icon-alert-circle class="ea-input-field__message-icon" />
      {{ errorMsg() }}
    </p>
  }

  @if (showHint()) {
    <p
      class="ea-input-field__message ea-input-field__message--hint"
      [id]="id() + '-hint'">
      {{ hint() }}
    </p>
  }
</div>
