<div class="ea-input-field">
  @if (label(); as labelText) {
    <ea-field-label
      [text]="labelText"
      [forId]="id()"
      [required]="required()" />
  }

  <div
    class="ea-input-wrapper"
    [ngClass]="wrapperClasses()">
    <span class="ea-input-wrapper__prefix">
      <ng-content select="[slot=prefix]" />
    </span>

    <input
      #inputEl
      class="ea-input"
      [id]="id()"
      [type]="effectiveType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="value()"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.list]="list() ?? null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="
        showError() ? id() + '-error' : showHint() ? id() + '-hint' : null
      "
      (input)="handleInput($event)"
      (focus)="handleFocus($event)"
      (blur)="handleBlur($event)" />

    <span class="ea-input-wrapper__suffix">
      <ng-content select="[slot=suffix]" />
    </span>

    @if (showClear()) {
      <button
        type="button"
        class="ea-input-wrapper__clear"
        [attr.aria-label]="i18n.messages().input.clear"
        (mousedown)="clear($event)">
        <ea-icon-x class="ea-input-wrapper__clear-icon" />
      </button>
    }

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        class="ea-input-wrapper__password-toggle"
        [attr.aria-label]="
          passwordVisible()
            ? i18n.messages().input.hidePassword
            : i18n.messages().input.showPassword
        "
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()">
        @if (passwordVisible()) {
          <ea-icon-eye-off />
        } @else {
          <ea-icon-eye />
        }
      </button>
    }
  </div>

  <ea-field-messages
    [id]="id()"
    [error]="showError() ? errorMsg() : null"
    [hint]="showHint() ? hint() : null" />
</div>
