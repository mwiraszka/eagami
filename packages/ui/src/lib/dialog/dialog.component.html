<dialog
  #dialogEl
  class="ea-dialog"
  [id]="id()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="!ariaLabel() && hasHeader() ? id() + '-header' : null"
  (click)="handleBackdropClick($event)"
  (cancel)="handleCancel($event)">
  <div
    class="ea-dialog__panel"
    [ngClass]="panelClasses()">
    <div
      class="ea-dialog__header"
      [class.ea-dialog__header--hidden]="!hasHeader() && !showClose()">
      <div
        #headerEl
        class="ea-dialog__header-content"
        [id]="id() + '-header'">
        <ng-content select="[slot=header]" />
      </div>
      @if (showClose()) {
        <button
          type="button"
          class="ea-dialog__close"
          [attr.aria-label]="i18n.messages().dialog.close"
          [disabled]="closeDisabled()"
          (click)="requestClose()">
          <ea-icon-x />
        </button>
      }
    </div>

    <div class="ea-dialog__body">
      <ng-content />
    </div>

    <div class="ea-dialog__status">
      <ng-content select="[slot=status]" />
    </div>

    <div class="ea-dialog__footer">
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</dialog>
