<!-- Story-layout helpers live here because @storybook/angular pipes neither the
     host styles array nor .storybook/ webpack rules into the iframe. -->
<style>
  /* Inset so focus rings aren't clipped by the iframe edge; !important overrides
     the inline padding:0 Storybook's docs view sets on <body>. */
  body {
    padding: 1rem !important;
  }

  /* Color the story render area with the page-background token so a dark-mode
     component sits on the dark canvas it is designed for, not on white. Scoped to
     the story wrappers so Storybook's own docs prose keeps its manager theme. */
  .docs-story,
  .sb-story,
  #storybook-root {
    background-color: var(--color-bg-canvas);
  }

  .story-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .story-stack {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  /* Room for focus rings. Don't set `display` here: it clobbers a paired
     `.story-stack` flex. Inline custom elements get their own block rule below. */
  .story-narrow {
    max-width: 360px;
    padding: 0.5rem;
  }
  .story-medium {
    max-width: 480px;
    padding: 0.5rem;
  }
  ea-autocomplete.story-narrow,
  ea-dropdown.story-narrow,
  ea-multi-select.story-narrow,
  ea-date-picker.story-narrow,
  ea-time-picker.story-narrow,
  ea-color-picker.story-narrow,
  ea-input.story-narrow,
  ea-textarea.story-narrow {
    display: block;
  }
</style>
