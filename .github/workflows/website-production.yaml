name: Website - Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
    paths:
      - 'apps/website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/website-production.yaml'

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      # Warm pnpm store so the install inside `vercel build` reuses it
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Angular's persistent build cache turns the cold SSR build into an
      # incremental one; keyed by sha so each run saves on top of the last
      - uses: actions/cache@v4
        with:
          path: apps/website/.angular/cache
          key: angular-production-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            angular-production-${{ hashFiles('pnpm-lock.yaml') }}-
            angular-production-

      - name: Install Vercel CLI
        run: pnpm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy Project Artifacts
        run: vercel deploy --prebuilt --prod --yes --scope=eagami --token=${{ secrets.VERCEL_TOKEN }}
