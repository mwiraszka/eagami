name: Website - Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'apps/website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/website-preview.yaml'

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Check version matches branch
        if: startsWith(github.ref_name, 'website-v') || contains(github.ref_name, '-website-v')
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == *-website-v* ]]; then
            BRANCH_VERSION="${BRANCH#*-website-v}"
          else
            BRANCH_VERSION="${BRANCH#website-v}"
          fi
          PKG_VERSION=$(jq -r .version apps/website/package.json)
          if [ "$BRANCH_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: branch website portion is website-v$BRANCH_VERSION but apps/website/package.json is $PKG_VERSION"
            exit 1
          fi

      # Guards hand-edits to the served integration guides; the script is
      # dependency-free so no workspace install is needed.
      - name: Check integration-guide token sync
        run: node packages/ui/scripts/sync-integration-guides.mjs --check

      - name: Install Vercel CLI
        run: pnpm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy Project Artifacts
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
