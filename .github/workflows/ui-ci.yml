name: UI — CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Check version matches branch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ui-v')
        run: |
          BRANCH="${GITHUB_HEAD_REF}"

          # Option B: library releases must pair with a website patch bump, so a
          # ui-v* branch must always carry a -website-v* suffix (see CLAUDE.md).
          if [[ "$BRANCH" != *-website-v* ]]; then
            echo "::error::Library releases must pair with a website patch bump. Use branch name ui-vA.B.C-website-vX.Y.Z"
            exit 1
          fi

          UI_PART="${BRANCH%%-website-v*}"
          BRANCH_VERSION="${UI_PART#ui-v}"
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$BRANCH_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: branch is ${UI_PART} but packages/ui/package.json is $PKG_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @eagami/ui lint

      - run: pnpm --filter @eagami/ui test:coverage

      - run: pnpm --filter @eagami/ui build

      # Bundle-size budget. The FESM is the npm-published bundle that
      # consumers tree-shake from, so its raw size is a useful regression
      # guard. Budget is set generously above the current size — bump it
      # deliberately when adding genuinely new surface area (a major new
      # component, an icon-set expansion).
      - name: Check bundle size
        run: |
          BUNDLE=packages/ui/dist/eagami-ui/fesm2022/eagami-ui.mjs
          SIZE=$(wc -c < "$BUNDLE")
          BUDGET=1850000
          printf "Bundle: %d bytes\nBudget: %d bytes\n" "$SIZE" "$BUDGET"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::@eagami/ui bundle ($SIZE bytes) exceeds the $BUDGET-byte budget. Either trim or raise the budget intentionally in .github/workflows/ui-ci.yml."
            exit 1
          fi

      - run: pnpm --filter @eagami/ui build-storybook
