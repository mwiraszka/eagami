name: UI - CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      # Generated docs data the website renders is derived from packages/ui
      # sources, so re-validate it whenever those committed files change too.
      - 'apps/website/src/app/data/ui-api.generated.ts'
      - 'apps/website/src/app/data/changelog.generated.ts'
      # Integration guides and the token export are generated from the SCSS
      # token source, so re-validate them whenever they change too.
      - 'apps/website/src/assets/eagami-ui-react.md'
      - 'apps/website/src/assets/eagami-ui-flutter.md'
      - 'apps/website/src/assets/eagami-ui-tokens.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    paths:
      - 'packages/ui/**'
      # Generated docs data the website renders is derived from packages/ui
      # sources, so re-validate it whenever those committed files change too.
      - 'apps/website/src/app/data/ui-api.generated.ts'
      - 'apps/website/src/app/data/changelog.generated.ts'
      # Integration guides and the token export are generated from the SCSS
      # token source, so re-validate them whenever they change too.
      - 'apps/website/src/assets/eagami-ui-react.md'
      - 'apps/website/src/assets/eagami-ui-flutter.md'
      - 'apps/website/src/assets/eagami-ui-tokens.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ui-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Check version matches branch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ui-v')
        run: |
          BRANCH="${GITHUB_HEAD_REF}"

          # Option B: library releases must pair with a website patch bump, so a
          # ui-v* branch must always carry a -website-v* suffix (see CLAUDE.md).
          if [[ "$BRANCH" != *-website-v* ]]; then
            echo "::error::Library releases must pair with a website patch bump. Use branch name ui-vA.B.C-website-vX.Y.Z"
            exit 1
          fi

          UI_PART="${BRANCH%%-website-v*}"
          BRANCH_VERSION="${UI_PART#ui-v}"
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$BRANCH_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: branch is ${UI_PART} but packages/ui/package.json is $PKG_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @eagami/ui lint

      - run: pnpm --filter @eagami/ui test:coverage

      # Post a per-PR coverage summary comment from the Vitest coverage output.
      # No third-party service; reads the json reporters emitted above.
      - name: Report coverage on PRs
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: packages/ui/coverage/eagami-ui/coverage-summary.json
          json-final-path: packages/ui/coverage/eagami-ui/coverage-final.json

      - run: pnpm --filter @eagami/ui build

      # The website renders generated data (component API + changelog) committed
      # under apps/website/src/app/data. Regenerate it from the packages/ui source
      # of truth, format to match the committed style, and fail on any diff so a
      # stale generated file can never merge.
      - name: Check generated docs data is current
        run: |
          pnpm --filter @eagami/ui docs:api
          pnpm --filter @eagami/ui docs:changelog
          pnpm --filter eagami-website exec prettier --write \
            src/app/data/ui-api.generated.ts \
            src/app/data/changelog.generated.ts
          GENERATED='apps/website/src/app/data/ui-api.generated.ts apps/website/src/app/data/changelog.generated.ts'
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Generated docs data is stale. Run 'pnpm ui docs:api && pnpm ui docs:changelog && pnpm format', then commit the result."
            git --no-pager diff -- $GENERATED
            exit 1
          fi

      # Demo/API parity: every input and output must carry an API-reference
      # description, every knob must map to a real input/output, and every
      # component with a knobs file must wire those knobs into its Storybook
      # story. Keeps the website demos and Storybook in lockstep with the API.
      - name: Check demo/API parity
        run: pnpm --filter @eagami/ui check-parity

      # Framework integration guides and the machine-readable token export
      # must match the SCSS token source. Regenerate with 'pnpm ui sync-guides'.
      - name: Check integration-guide token sync
        run: pnpm --filter @eagami/ui check-tokens

      # Bundle-size budget. The FESM is the npm-published bundle that
      # consumers tree-shake from, so its raw size is a useful regression
      # guard. Budget is set generously above the current size; bump it
      # deliberately when adding genuinely new surface area (a major new
      # component, an icon-set expansion).
      - name: Check bundle size
        run: |
          BUNDLE=packages/ui/dist/eagami-ui/fesm2022/eagami-ui.mjs
          SIZE=$(wc -c < "$BUNDLE")
          BUDGET=2400000
          printf "Bundle: %d bytes\nBudget: %d bytes\n" "$SIZE" "$BUDGET"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::@eagami/ui bundle ($SIZE bytes) exceeds the $BUDGET-byte budget. Either trim or raise the budget intentionally in .github/workflows/ui-ci.yml."
            exit 1
          fi

      - run: pnpm --filter @eagami/ui build-storybook
