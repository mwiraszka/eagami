name: UI - Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'ui-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Only the publish uses npm: npm 11+ does the registry OIDC token exchange for trusted
      # publishing that pnpm publish cannot; Node 22 still ships npm 10
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @eagami/ui lint

      - run: pnpm --filter @eagami/ui test:coverage

      - run: pnpm --filter @eagami/ui publish:lib

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Branch may be standalone (ui-vX.Y.Z) or combined (ui-vA.B.C-website-vX.Y.Z).
          # Strip any -website-v* suffix to isolate the library tag.
          UI_TAG="${BRANCH%%-website-v*}"
          SEMVER="${UI_TAG#ui-v}"
          NOTES=$(awk "/^## \[${SEMVER}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" packages/ui/CHANGELOG.md)

          git tag "$UI_TAG"
          git push origin "$UI_TAG"
          gh release create "$UI_TAG" --title "$UI_TAG" --notes "$NOTES"
